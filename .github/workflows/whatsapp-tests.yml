name: WhatsApp webhook regression tests
on:
  push:
    branches:
      - fix/whatsapp-webhook-supabase
  pull_request:
    paths:
      - 'src/app/api/whatsapp/**'
      - 'tests/**'
      - 'package.json'
jobs:
  webhook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript for synthetic webhook tests
        run: npm install --no-save --no-package-lock typescript
      - name: Run webhook tests
        run: npm test
