name: Homologacao automatizada
on:
  push:
    branches:
      - fix/whatsapp-webhook-supabase
      - chore/final-homologacao-20261106
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/whatsapp-tests.yml'
  workflow_dispatch:
jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Build Next.js
        run: npm run build
